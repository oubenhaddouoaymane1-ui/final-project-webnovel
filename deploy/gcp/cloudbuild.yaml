##############################################################################
# CineOS — Google Cloud Build Configuration
# Deploys CineOS containers to Google Cloud Run
##############################################################################

steps:
  # ── Build and push Docker images ──────────────────────────────────────────

  # Cloud Bridge
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_GCR_HOST/$PROJECT_ID/cineos-cloud-bridge:$COMMIT_SHA'
      - '-f'
      - 'docker/cloud_bridge/Dockerfile'
      - 'docker/cloud_bridge'
    id: build-cloud-bridge

  # Telegram Bot
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_GCR_HOST/$PROJECT_ID/cineos-telegram:$COMMIT_SHA'
      - '-f'
      - 'Dockerfile'
      - '.'
    id: build-telegram-bot

  # Supervisor
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_GCR_HOST/$PROJECT_ID/cineos-supervisor:$COMMIT_SHA'
      - '-f'
      - 'workers/Dockerfile'
      - 'workers'
    id: build-supervisor

  # Render Worker
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_GCR_HOST/$PROJECT_ID/cineos-render-worker:$COMMIT_SHA'
      - '-f'
      - 'docker/ffmpeg/Dockerfile'
      - 'docker/ffmpeg'
    id: build-render-worker

  # Voice Worker
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_GCR_HOST/$PROJECT_ID/cineos-voice-worker:$COMMIT_SHA'
      - '-f'
      - 'docker/voice/Dockerfile'
      - 'docker/voice'
    id: build-voice-worker

  # Push all images
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', '$_GCR_HOST/$PROJECT_ID/cineos-*']
    id: push-images

  # ── Deploy to Cloud Run ───────────────────────────────────────────────────

  # Cloud Bridge
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'cineos-cloud-bridge'
      - '--image=$_GCR_HOST/$PROJECT_ID/cineos-cloud-bridge:$COMMIT_SHA'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=2'
      - '--port=8600'
      - '--set-env-vars=SERVICE_NAME=cloud_bridge,BRIDGE_PORT=8600,LOG_LEVEL=INFO'
      - '--add-cloudsql-instances=$_CLOUDSQL_CONNECTION'
      - '--set-secrets=OPENROUTER_API_KEY=openrouter-api-key:latest,POSTGRES_PASSWORD=postgres-password:latest'
    id: deploy-cloud-bridge

  # Supervisor
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'cineos-supervisor'
      - '--image=$_GCR_HOST/$PROJECT_ID/cineos-supervisor:$COMMIT_SHA'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=2'
      - '--port=8000'
      - '--set-env-vars=SERVICE_NAME=supervisor,MAX_PARALLEL_JOBS=4,LOG_LEVEL=INFO'
      - '--add-cloudsql-instances=$_CLOUDSQL_CONNECTION'
      - '--set-secrets=POSTGRES_PASSWORD=postgres-password:latest'
    id: deploy-supervisor

  # Render Worker
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'cineos-render-worker'
      - '--image=$_GCR_HOST/$PROJECT_ID/cineos-render-worker:$COMMIT_SHA'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--memory=1Gi'
      - '--cpu=2'
      - '--min-instances=0'
      - '--max-instances=4'
      - '--port=8300'
      - '--set-env-vars=SERVICE_NAME=render_worker,LOG_LEVEL=INFO'
      - '--add-cloudsql-instances=$_CLOUDSQL_CONNECTION'
      - '--set-secrets=POSTGRES_PASSWORD=postgres-password:latest'
    id: deploy-render-worker

  # Voice Worker
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'cineos-voice-worker'
      - '--image=$_GCR_HOST/$PROJECT_ID/cineos-voice-worker:$COMMIT_SHA'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--memory=256Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=3'
      - '--port=8400'
      - '--set-env-vars=SERVICE_NAME=voice_worker,WORKER_PORT=8400,LOG_LEVEL=INFO'
      - '--add-cloudsql-instances=$_CLOUDSQL_CONNECTION'
      - '--set-secrets=POSTGRES_PASSWORD=postgres-password:latest'
    id: deploy-voice-worker

  # Telegram Bot
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'cineos-telegram-bot'
      - '--image=$_GCR_HOST/$PROJECT_ID/cineos-telegram:$COMMIT_SHA'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--memory=256Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=1'
      - '--no-allow-unauthenticated'
      - '--set-env-vars=SERVICE_NAME=telegram_bot,DEFAULT_LANGUAGE=en,LOG_LEVEL=INFO'
      - '--add-cloudsql-instances=$_CLOUDSQL_CONNECTION'
      - '--set-secrets=TELEGRAM_BOT_TOKEN=telegram-bot-token:latest,POSTGRES_PASSWORD=postgres-password:latest'
    id: deploy-telegram-bot

substitutions:
  _GCR_HOST: gcr.io
  _REGION: us-central1
  _CLOUDSQL_CONNECTION: $PROJECT_ID:us-central1:cineos-db

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: '1800s'
