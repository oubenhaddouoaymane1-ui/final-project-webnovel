version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: cineos-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: cineos
      POSTGRES_USER: cineos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cineos_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cineos -d cineos"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - cineos-network

  n8n:
    image: n8nio/n8n:latest
    container_name: cineos-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: cineos
      DB_POSTGRESDB_USER: cineos
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-cineos_secret}
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD:-cineos_n8n}
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://n8n:5678/
      GENERIC_TIMEZONE: Europe/Moscow
      TZ: Europe/Moscow
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - cineos-network

  redis:
    image: redis:7-alpine
    container_name: cineos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cineos-network

  telegram_bot:
    build:
      context: ../
      dockerfile: docker/telegram/Dockerfile
    container_name: cineos-telegram-bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      n8n:
        condition: service_healthy
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      N8N_WEBHOOK_URL: http://n8n:5678/webhook
      DATABASE_URL: postgresql://cineos:${POSTGRES_PASSWORD:-cineos_secret}@postgres:5432/cineos
      REDIS_URL: redis://redis:6379/0
      BOT_NAME: ${BOT_NAME:-CineOS Bot}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - cineos-network

volumes:
  postgres_data:
    driver: local
  n8n_data:
    driver: local
  redis_data:
    driver: local

networks:
  cineos-network:
    driver: bridge
    name: cineos-network
