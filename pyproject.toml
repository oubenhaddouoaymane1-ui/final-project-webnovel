[project]
name = "cineos"
version = "1.0.0"
description = "Novel-to-Cinematic AI Production Platform"
requires-python = ">=3.11"
license = {text = "MIT"}

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "T20", "SIM"]
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["cineos"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.mypy.overrides]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests",
    "unit: marks unit tests",
]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src", "workers"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true
